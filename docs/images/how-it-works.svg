<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-label="Как 8V97051 синтезирует частоту: опорный тракт, PFD, накачка, фильтр петли, ГУН, выходной делитель и дробный делитель обратной связи">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="1" stop-color="#0a0e15"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity="0.025"/>
    </pattern>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fb923c"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <clipPath id="card"><rect width="1200" height="640" rx="24"/></clipPath>
  </defs>
  <style>
    .t{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
    .slow{animation-duration:2.2s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    @media (prefers-reduced-motion:reduce){.flow{animation:none}}
    .h{font-size:14px;font-weight:700;fill:#e8edf5}
    .s{font-size:12px}
    .n{font-size:11px;fill:#7d8aa0}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="640" fill="url(#bg)"/>
    <rect width="1200" height="640" fill="url(#grid)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="639" rx="23.5" fill="none" stroke="#222b3b"/>

  <text class="t" x="51" y="52" font-size="24" font-weight="700" fill="#e8edf5">Как 8V97051 синтезирует частоту</text>
  <text class="t" x="51" y="78" font-size="14" fill="#b6c1d3">Опора делится до частоты сравнения fPFD; петля ФАПЧ подстраивает ГУН, пока fVCO / N не совпадёт с fPFD. Дробный N даёт мелкий шаг.</text>

  <!-- top tags -->
  <g class="t">
    <rect x="320" y="100" width="140" height="30" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.6" stroke-dasharray="4 3"/>
    <text x="390" y="120" text-anchor="middle" class="s" fill="#6ee7b7">Lock Detect → LD</text>
    <rect x="726" y="100" width="168" height="30" rx="8" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-opacity="0.6" stroke-dasharray="4 3"/>
    <text x="810" y="120" text-anchor="middle" class="s" fill="#fcd34d">Автокалибровка ядра</text>
    <rect x="985" y="100" width="164" height="30" rx="8" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-opacity="0.6" stroke-dasharray="4 3"/>
    <text x="1067" y="120" text-anchor="middle" class="s" fill="#6ee7b7">SPI: регистры R0–R7</text>
  </g>
  <g fill="none" stroke-width="1.4" stroke-dasharray="3 4">
    <path d="M390 156V130" stroke="#34d399"/>
    <path d="M810 130V154" stroke="#fbbf24" marker-end="url(#aA)"/>
  </g>

  <!-- chain wires -->
  <g fill="none" stroke-width="2.2">
    <path class="flow" d="M169 194H178" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path class="flow" d="M309 194H318" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path class="flow" d="M449 194H458" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path class="flow" d="M589 194H598" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path class="flow" d="M729 194H738" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path class="flow" d="M869 194H878" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow" d="M1009 194H1018" stroke="#fb923c" marker-end="url(#aO)"/>
    <!-- feedback -->
    <path class="flow slow" d="M810 232V300H692" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow slow" d="M470 300H390V234" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow slow" d="M580 356V330" stroke="#34d399" marker-end="url(#aG)"/>
  </g>

  <!-- chain blocks -->
  <g class="t" text-anchor="middle">
    <rect x="51" y="156" width="118" height="76" rx="12" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="110" y="183" class="h">Опора</text>
    <text x="110" y="202" class="s" fill="#67e8f9">TCXO 25 МГц</text>
    <text x="110" y="219" class="n">или SMA J1</text>

    <rect x="191" y="156" width="118" height="76" rx="12" fill="#22d3ee" fill-opacity="0.07" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="250" y="183" class="h">×2 · ÷R · ÷2</text>
    <text x="250" y="202" class="s" fill="#67e8f9">D, R, T</text>
    <text x="250" y="219" class="n">R = 1…1023</text>

    <rect x="331" y="156" width="118" height="76" rx="12" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="390" y="183" class="h">PFD</text>
    <text x="390" y="202" class="s" fill="#c4b5fd">≤ 125 МГц Frac</text>
    <text x="390" y="219" class="n">≤ 310 МГц Int</text>

    <rect x="471" y="156" width="118" height="76" rx="12" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="530" y="183" class="h">Накачка CP</text>
    <text x="530" y="202" class="s" fill="#c4b5fd">0.31–5 мА</text>
    <text x="530" y="219" class="n">16 ступеней ICP</text>

    <rect x="611" y="156" width="118" height="76" rx="12" fill="#a78bfa" fill-opacity="0.09" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="670" y="183" class="h">Фильтр петли</text>
    <text x="670" y="202" class="s" fill="#c4b5fd">внешний RC</text>
    <text x="670" y="219" class="n">CP_OUT → VTUNE</text>

    <rect x="751" y="156" width="118" height="76" rx="12" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="810" y="183" class="h">ГУН · 3 ядра</text>
    <text x="810" y="202" class="s" fill="#fcd34d">2.2–4.4 ГГц</text>
    <text x="810" y="219" class="n">Kvco ≈ 40 МГц/В</text>

    <rect x="891" y="156" width="118" height="76" rx="12" fill="#fbbf24" fill-opacity="0.09" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="950" y="183" class="h">÷ M0</text>
    <text x="950" y="202" class="s" fill="#fcd34d">1, 2, 4 … 64</text>
    <text x="950" y="219" class="n">выходной делитель</text>

    <rect x="1031" y="156" width="118" height="76" rx="12" fill="#fb923c" fill-opacity="0.09" stroke="#fb923c" stroke-width="1.6"/>
    <text x="1090" y="183" class="h">RF_OUTA / B</text>
    <text x="1090" y="202" class="s" fill="#fdba74">34.4 МГц – 4.4 ГГц</text>
    <text x="1090" y="219" class="n">−4 … +7 dBm</text>

    <!-- feedback blocks -->
    <rect x="470" y="272" width="222" height="58" rx="12" fill="#fbbf24" fill-opacity="0.07" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="581" y="296" class="h">÷ N = INT + FRAC / MOD</text>
    <text x="581" y="316" class="s" fill="#fcd34d">16 бит · регистры R0, R1, R7</text>

    <rect x="470" y="356" width="222" height="52" rx="12" fill="#34d399" fill-opacity="0.07" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="581" y="378" class="h">ΣΔ-модулятор</text>
    <text x="581" y="396" class="s" fill="#6ee7b7">шум дробности — за полосу петли</text>
  </g>

  <!-- side notes -->
  <g class="t" font-size="12" fill="#7d8aa0">
    <text x="706" y="326">обратная связь: fVCO / N</text>
    <text x="706" y="343">сравнивается с fPFD</text>
  </g>

  <!-- legend -->
  <g class="t" font-size="12" fill="#b6c1d3">
    <rect x="51" y="440" width="12" height="12" rx="3" fill="#22d3ee"/><text x="71" y="450">опорный тракт</text>
    <rect x="181" y="440" width="12" height="12" rx="3" fill="#a78bfa"/><text x="201" y="450">детектор и петля</text>
    <rect x="331" y="440" width="12" height="12" rx="3" fill="#fbbf24"/><text x="351" y="450">ВЧ-тракт</text>
    <rect x="431" y="440" width="12" height="12" rx="3" fill="#fb923c"/><text x="451" y="450">выходы</text>
    <rect x="521" y="440" width="12" height="12" rx="3" fill="#34d399"/><text x="541" y="450">цифровое управление</text>
    <text x="1149" y="450" text-anchor="end" fill="#7d8aa0">пример: RF_OUTA = 1 234.5 МГц от TCXO 25 МГц</text>
  </g>

  <!-- formula cards -->
  <g class="t">
    <rect x="51" y="470" width="346" height="104" rx="14" fill="#141a26" stroke="#2d384b"/>
    <text x="71" y="496" font-size="11" fill="#67e8f9" letter-spacing="1.3">1 · ЧАСТОТА СРАВНЕНИЯ</text>
    <text class="m" x="71" y="527" font-size="16" fill="#e8edf5">fPFD = fREF·(1+D) / (R·(1+T))</text>
    <text class="m" x="71" y="556" font-size="13" fill="#7d8aa0">25 МГц · 2 / 1 = <tspan fill="#67e8f9">50 МГц</tspan></text>

    <rect x="427" y="470" width="346" height="104" rx="14" fill="#141a26" stroke="#2d384b"/>
    <text x="447" y="496" font-size="11" fill="#fcd34d" letter-spacing="1.3">2 · ЧАСТОТА ГУН</text>
    <text class="m" x="447" y="527" font-size="16" fill="#e8edf5">fVCO = fPFD · (INT + FRAC/MOD)</text>
    <text class="m" x="447" y="556" font-size="13" fill="#7d8aa0">50 · (49 + 19/50) = <tspan fill="#fcd34d">2 469 МГц</tspan></text>

    <rect x="803" y="470" width="346" height="104" rx="14" fill="#141a26" stroke="#2d384b"/>
    <text x="823" y="496" font-size="11" fill="#fdba74" letter-spacing="1.3">3 · ВЫХОД</text>
    <text class="m" x="823" y="527" font-size="16" fill="#e8edf5">fOUT = fVCO / M0</text>
    <text class="m" x="823" y="556" font-size="13" fill="#7d8aa0">2 469 МГц / 2 = <tspan fill="#fdba74">1 234.5 МГц</tspan></text>
  </g>

  <text class="t" x="51" y="608" font-size="13" fill="#b6c1d3">Шаг сетки = fPFD / MOD / M0 = 50 МГц / 50 / 2 = <tspan fill="#e8edf5" font-weight="600">500 кГц</tspan>. Планировщик PLL Studio перебирает D, R, T, INT, FRAC, MOD и M0 в точной рациональной арифметике.</text>
</svg>
