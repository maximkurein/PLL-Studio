<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-label="PLL Studio — интерактивная лаборатория RF-синтезатора IDT/Renesas 8V97051">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a2b"/>
      <stop offset="1" stop-color="#080b12"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.76" cy="0.38" r="0.48">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#ffffff" fill-opacity="0.05"/>
    </pattern>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#151b2b"/>
      <stop offset="1" stop-color="#070a11"/>
    </linearGradient>
    <clipPath id="card"><rect width="1280" height="420" rx="28"/></clipPath>
    <marker id="aC" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#22d3ee"/></marker>
    <marker id="aV" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
  </defs>
  <style>
    .t{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace}
    .flow{stroke-dasharray:7 9;animation:flow 1.1s linear infinite}
    .slow{animation-duration:2.2s}
    @keyframes flow{to{stroke-dashoffset:-32}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glowV)"/>
    <rect width="1280" height="420" fill="url(#glowC)"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="27.5" fill="none" stroke="#2a3346"/>

  <!-- Icon -->
  <g transform="translate(58 58) scale(0.104)">
    <rect x="64" y="64" width="896" height="896" rx="200" fill="url(#iconbg)"/>
    <rect x="64" y="64" width="896" height="896" rx="200" fill="none" stroke="#2a3346" stroke-width="12"/>
    <g stroke="#3a4560" stroke-width="18" stroke-linecap="round">
      <path d="M300 200v-60M412 200v-60M524 200v-60M636 200v-60M748 200v-60"/>
      <path d="M300 884v-60M412 884v-60M524 884v-60M636 884v-60M748 884v-60"/>
    </g>
    <rect x="236" y="236" width="552" height="552" rx="72" fill="#0d1220" stroke="#3a4560" stroke-width="14"/>
    <path d="M286 512 C 336 392, 376 392, 416 512 S 496 632, 536 512 S 616 392, 656 512 S 716 612, 738 560" fill="none" stroke="url(#wave)" stroke-width="40" stroke-linecap="round"/>
    <circle cx="738" cy="372" r="34" fill="#34d399"/>
  </g>

  <!-- Title -->
  <text class="t" x="176" y="118" font-size="58" font-weight="700" fill="#e8edf5" letter-spacing="-1">PLL Studio</text>
  <text class="t" x="178" y="150" font-size="16" fill="#7d8aa0" letter-spacing="2">RUST · TAURI 2 · REACT 19</text>

  <text class="t" x="64" y="216" font-size="23" font-weight="600" fill="#e8edf5">Интерактивная лаборатория RF-синтезатора</text>
  <text class="t" x="64" y="248" font-size="17" fill="#b6c1d3">IDT/Renesas 8V97051 и оценочной платы 8V9705x EVB:</text>
  <text class="t" x="64" y="273" font-size="17" fill="#b6c1d3">регистры, частота, петля ФАПЧ, шум — и виртуальный кристалл</text>

  <!-- Pills -->
  <g class="t" font-size="15" text-anchor="middle">
    <rect x="64" y="304" width="200" height="34" rx="17" fill="#22d3ee" fill-opacity="0.10" stroke="#22d3ee" stroke-opacity="0.45"/>
    <text x="164" y="326" fill="#67e8f9">34.375 МГц – 4.4 ГГц</text>
    <rect x="276" y="304" width="190" height="34" rx="17" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-opacity="0.45"/>
    <text x="371" y="326" fill="#c4b5fd">Int-N · Frac-N · ΣΔ</text>
    <rect x="64" y="348" width="214" height="34" rx="17" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-opacity="0.45"/>
    <text x="171" y="370" fill="#fcd34d">Симулятор без платы</text>
    <rect x="290" y="348" width="210" height="34" rx="17" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
    <text x="395" y="370" fill="#6ee7b7">macOS · Windows · Web</text>
  </g>

  <!-- Loop panel -->
  <rect x="668" y="48" width="564" height="324" rx="20" fill="#0b0f18" fill-opacity="0.72" stroke="#2a3346"/>
  <text class="t" x="692" y="82" font-size="12" fill="#7d8aa0" letter-spacing="1.6">ПЕТЛЯ ФАПЧ 8V97051</text>
  <g class="pulse">
    <circle cx="1146" cy="78" r="5" fill="#34d399"/>
  </g>
  <text class="t" x="1158" y="83" font-size="13" font-weight="600" fill="#6ee7b7">захват</text>

  <!-- wires -->
  <g fill="none" stroke-width="2.2">
    <path class="flow" d="M768 144H792" stroke="#22d3ee" marker-end="url(#aC)"/>
    <path class="flow" d="M874 144H898" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path class="flow" d="M980 144H1004" stroke="#a78bfa" marker-end="url(#aV)"/>
    <path class="flow" d="M1096 144H1118" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow slow" d="M1051 172V236H1003" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow slow" d="M879 236H834V174" stroke="#fbbf24" marker-end="url(#aA)"/>
    <path class="flow slow" d="M940 284V260" stroke="#34d399" marker-end="url(#aG)"/>
  </g>

  <!-- blocks -->
  <g class="t" text-anchor="middle">
    <rect x="688" y="116" width="80" height="56" rx="10" fill="#22d3ee" fill-opacity="0.08" stroke="#22d3ee" stroke-width="1.6"/>
    <text x="728" y="140" font-size="15" font-weight="700" fill="#e8edf5">REF</text>
    <text x="728" y="159" font-size="12" fill="#67e8f9">25 МГц</text>

    <rect x="794" y="116" width="80" height="56" rx="10" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="834" y="140" font-size="15" font-weight="700" fill="#e8edf5">PFD</text>
    <text x="834" y="159" font-size="12" fill="#c4b5fd">≤ 310 МГц</text>

    <rect x="900" y="116" width="80" height="56" rx="10" fill="#a78bfa" fill-opacity="0.10" stroke="#a78bfa" stroke-width="1.6"/>
    <text x="940" y="140" font-size="15" font-weight="700" fill="#e8edf5">CP · LF</text>
    <text x="940" y="159" font-size="12" fill="#c4b5fd">VTUNE</text>

    <rect x="1006" y="116" width="90" height="56" rx="10" fill="#fbbf24" fill-opacity="0.10" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="1051" y="140" font-size="15" font-weight="700" fill="#e8edf5">VCO</text>
    <text x="1051" y="159" font-size="12" fill="#fcd34d">2.2–4.4 ГГц</text>

    <rect x="879" y="214" width="122" height="44" rx="10" fill="#fbbf24" fill-opacity="0.08" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="940" y="233" font-size="15" font-weight="700" fill="#e8edf5">÷ N</text>
    <text class="m" x="940" y="250" font-size="11" fill="#fcd34d">INT + FRAC/MOD</text>

    <rect x="879" y="284" width="122" height="40" rx="10" fill="#34d399" fill-opacity="0.08" stroke="#34d399" stroke-width="1.6" stroke-dasharray="5 4"/>
    <text x="940" y="302" font-size="14" font-weight="700" fill="#e8edf5">ΣΔ</text>
    <text x="940" y="317" font-size="11" fill="#6ee7b7">дробный N</text>
  </g>

  <!-- mini spectrum -->
  <rect x="1120" y="104" width="92" height="84" rx="10" fill="#07120d" stroke="#1f5a45"/>
  <g stroke="#1f5a45" stroke-width="0.6" opacity="0.7">
    <path d="M1120 132H1212M1120 160H1212M1151 104V188M1182 104V188"/>
  </g>
  <path d="M1126 176L1132 175L1138 177L1144 174L1150 173L1155 170L1160 163Q1163 150 1166 114Q1169 150 1172 163L1177 170L1182 173L1188 174L1194 177L1200 175L1206 176" fill="none" stroke="#34d399" stroke-width="2" stroke-linejoin="round"/>
  <text class="t" x="1166" y="210" font-size="12" text-anchor="middle" fill="#7d8aa0">RF_OUT</text>

  <!-- formula -->
  <text class="m" x="692" y="354" font-size="13" fill="#7d8aa0">fOUT = fPFD · (INT + FRAC/MOD) / M0</text>
</svg>
