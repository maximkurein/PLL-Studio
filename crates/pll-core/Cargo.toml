[package]
name = "pll-core"
description = "8V97051 RF synthesizer model: register map, frequency planner, loop/phase-noise models, virtual chip and hardware links"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
serialport = { version = "4", default-features = false }
nusb = "0.1"
